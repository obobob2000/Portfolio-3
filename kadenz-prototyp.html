<div class="kz-page" id="kz">

            <div class="sys">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>

          </div>

          <section class="screen" data-screen="form" aria-label="Form"></section>
          <section class="screen" data-screen="plan" aria-label="Plan"></section>

          <nav class="tabs glass" aria-label="Hauptnavigation">
            <span class="ind"></span>
            <button class="tab" type="button" data-tab="heute"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#fff" stroke-width="1.65" stroke-linecap="round"><circle cx="11" cy="11" r="3.67" fill="#fff"/><path d="M11 1.8v1.9M11 18.3v1.9M1.8 11h1.9M18.3 11h1.9M4.5 4.5l1.3 1.3M16.2 16.2l1.3 1.3M4.5 17.5l1.3-1.3M16.2 5.8l1.3-1.3"/></svg>Heute</button>

          <span class="touch" aria-hidden="true"></span>

          <div class="scrim" data-act="close-sheet"></div>
          <div class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="kz-sheet-title">
            <button class="grab" type="button" data-act="close-sheet" aria-label="Schließen" style="width:36px"></button>
            <div class="col g8 srise" style="--i:0">
              <p class="eyebrow acc">Gegen die Empfehlung</p>
              <p class="h2" id="kz-sheet-title">VO2max trotzdem fahren?</p>
              <p class="body">Mit Bereitschaft 68 kostet dich die harte Einheit mehr Erholung, als sie bringt.</p>
            </div>
            <div class="card glass conseq srise" style="--i:1">
              <div class="r"><span class="mut">Bereitschaft morgen</span><span class="row g8"><s class="mut">71</s><b class="sb acc">ca. 52</b></span></div>
              <div class="r"><span class="mut">Erholungszeit</span><b class="sb acc">+1 Tag</b></div>
              <div class="r"><span class="mut">Sa · Lange Ausfahrt</span><b class="sb">wird gekürzt</b></div>
            </div>
            <div class="col g8 srise" style="--i:2">
              <button class="btn pri" type="button" data-act="choose-z2">Doch Z2 fahren</button>
              <button class="btn sec" type="button" data-act="choose-vo2">VO2max wie geplant</button>

  </div>
</div>
